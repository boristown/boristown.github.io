<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯利公式计算器 - 简约融合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .soft-card {
            background: white;
            border: 1px solid #f1f5f9;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .input-field {
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            appearance: none;
            -moz-appearance: textfield;
        }
        .input-field::-webkit-outer-spin-button,
        .input-field::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
        /* 数字更新动画 */
        @keyframes value-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .updated { animation: value-pop 0.2s ease-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="soft-card rounded-3xl p-8 w-full max-w-md">
        <div class="flex items-center space-x-3 mb-8">
            <div class="h-10 w-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-200">
                <span class="italic text-lg">K</span>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">凯利计算器</h2>
                <p class="text-xs text-slate-400 font-medium">简约交互融合版</p>
            </div>
        </div>
        
        <div class="space-y-5 mb-8">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">总本金 (M)</label>
                <input type="number" id="M" value="10000" class="input-field w-full px-4 py-3 rounded-xl text-slate-700 font-medium">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">市场价格 (p1)</label>
                    <input type="number" id="p1" value="0.5" step="0.01" class="input-field w-full px-4 py-3 rounded-xl text-slate-700 font-medium">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">评估概率 (p2)</label>
                    <input type="number" id="p2" value="0.6" step="0.01" class="input-field w-full px-4 py-3 rounded-xl text-slate-700 font-bold text-indigo-600">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-3 ml-1 flex justify-between">
                    <span>执行率 (k)</span>
                    <span id="k-val" class="text-indigo-600 font-bold">1.0</span>
                </label>
                <input type="range" id="k" min="0" max="1" step="0.1" value="1.0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                <div class="flex justify-between text-[10px] text-slate-400 mt-2 px-1">
                    <span>保守</span>
                    <span>激进 (满注)</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-6 text-white shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm">目标持仓比例</span>
                <span id="res-percent" class="text-xl font-bold text-indigo-300 tabular-nums">--</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm">应持有头寸数</span>
                <span id="res-shares" class="text-xl font-bold tabular-nums">--</span>
            </div>
            <div class="h-px bg-slate-800 my-1"></div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm font-medium">当前投入成本</span>
                <span id="res-cost" class="text-2xl font-bold text-emerald-400 tabular-nums">--</span>
            </div>
        </div>
        
        <p id="msg" class="mt-4 text-center text-xs font-bold text-amber-600 py-2 bg-amber-50 rounded-lg hidden"></p>
    </div>

    <script>
        const inputs = ['M', 'p1', 'p2', 'k'];
        const el = {};
        inputs.forEach(id => el[id] = document.getElementById(id));
        const kValLabel = document.getElementById('k-val');
        
        function calculate() {
            const M = parseFloat(el.M.value), p1 = parseFloat(el.p1.value), p2 = parseFloat(el.p2.value), k = parseFloat(el.k.value);
            const msg = document.getElementById('msg');
            kValLabel.innerText = k.toFixed(1);
            
            msg.classList.add('hidden');
            const results = [document.getElementById('res-percent'), document.getElementById('res-shares'), document.getElementById('res-cost')];
            
            // 增加微动效反馈
            results.forEach(r => { 
                r.classList.remove('updated'); 
                void r.offsetWidth; 
                r.classList.add('updated'); 
            });

            if (p2 <= p1) {
                results[0].innerText = "0.00%";
                results[1].innerText = "0";
                results[2].innerText = "$0.00";
                msg.innerText = "⚠️ 提示：评估概率不占优，建议不开仓";
                msg.classList.remove('hidden');
                return;
            }

            const f_star = (p2 - p1) / (1 - p1);
            const target_f = f_star * k;
            const N = (M * target_f) / p1;

            results[0].innerText = (target_f * 100).toFixed(2) + "%";
            results[1].innerText = Math.floor(N).toLocaleString();
            results[2].innerText = "$" + (Math.floor(N) * p1).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        inputs.forEach(id => el[id].addEventListener('input', calculate));
        calculate();
    </script>
</body>
</html>
