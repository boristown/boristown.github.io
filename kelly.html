<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly Pro - Minimalist Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* 去掉 Chrome, Safari, Edge, Opera 的上下箭头 */
            appearance: none;
            -moz-appearance: textfield; /* Firefox */
        }
        /* 针对 Webkit 浏览器进一步清理箭头 */
        .input-glass::-webkit-outer-spin-button,
        .input-glass::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-glass:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }
        @keyframes value-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .updated { animation: value-pop 0.2s ease-out; }
    </style>
</head>
<body class="flex items-center justify-center p-6 text-slate-200">

    <div class="glass-card rounded-[2rem] shadow-2xl p-8 w-full max-w-lg relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 blur-[100px]"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-600/10 blur-[100px]"></div>

        <div class="relative flex items-center justify-between mb-10">
            <div class="flex items-center space-x-4">
                <div class="h-12 w-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="text-white font-black text-xl italic">K</span>
                </div>
                <div>
                    <h2 class="text-2xl font-bold tracking-tight text-white">Kelly <span class="text-indigo-400">Pro</span></h2>
                    <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500">Binary Event Positioner</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] px-2 py-1 rounded-full border border-slate-700 text-slate-400">Pure Input</span>
            </div>
        </div>
        
        <div class="space-y-6 mb-10">
            <div class="grid grid-cols-1 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2 ml-1 uppercase">Total Capital (M)</label>
                    <input type="number" id="M" value="10000" class="input-glass w-full px-5 py-3 rounded-2xl outline-none text-lg font-medium">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-2 ml-1 uppercase">Market p1</label>
                        <input type="number" id="p1" value="0.5" step="0.01" class="input-glass w-full px-5 py-3 rounded-2xl outline-none text-lg font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-2 ml-1 uppercase text-indigo-400">Edge p2</label>
                        <input type="number" id="p2" value="0.6" step="0.01" class="input-glass w-full px-5 py-3 rounded-2xl outline-none text-lg font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2 ml-1 uppercase flex justify-between">
                        <span>Kelly Fraction (k)</span>
                        <span id="k-val" class="text-indigo-400 font-bold">1.0</span>
                    </label>
                    <input type="range" id="k" min="0" max="1" step="0.1" value="1.0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>
            </div>
        </div>

        <div class="bg-slate-950/50 rounded-[1.5rem] p-7 border border-white/5 space-y-5">
            <div class="flex justify-between items-end">
                <span class="text-sm font-medium text-slate-500">Target Weight</span>
                <span id="res-percent" class="text-3xl font-bold tracking-tighter text-indigo-400 tabular-nums">--</span>
            </div>
            <div class="flex justify-between items-end">
                <span class="text-sm font-medium text-slate-500">Units Required</span>
                <span id="res-shares" class="text-2xl font-bold text-slate-200 tabular-nums">--</span>
            </div>
            <div class="h-px bg-gradient-to-r from-transparent via-slate-800 to-transparent my-2"></div>
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-slate-500">Total Investment</span>
                <span id="res-cost" class="text-3xl font-black text-emerald-400 tabular-nums drop-shadow-[0_0_10px_rgba(52,211,153,0.2)]">--</span>
            </div>
        </div>
        
        <p id="msg" class="mt-6 text-center text-[11px] font-bold text-amber-500/80 tracking-widest uppercase hidden"></p>
    </div>

    <script>
        const inputs = ['M', 'p1', 'p2', 'k'];
        const el = {};
        inputs.forEach(id => el[id] = document.getElementById(id));
        const kValLabel = document.getElementById('k-val');
        
        function calculate() {
            const M = parseFloat(el.M.value), p1 = parseFloat(el.p1.value), p2 = parseFloat(el.p2.value), k = parseFloat(el.k.value);
            const msg = document.getElementById('msg');
            kValLabel.innerText = k.toFixed(1);
            
            msg.classList.add('hidden');
            const results = [document.getElementById('res-percent'), document.getElementById('res-shares'), document.getElementById('res-cost')];
            results.forEach(r => { r.classList.remove('updated'); void r.offsetWidth; r.classList.add('updated'); });

            if (p2 <= p1) {
                results[0].innerText = "0.00%";
                results[1].innerText = "0";
                results[2].innerText = "$0.00";
                msg.innerText = "● System Alert: No Advantage Detected";
                msg.classList.remove('hidden');
                return;
            }

            const f_star = (p2 - p1) / (1 - p1);
            const target_f = f_star * k;
            const N = (M * target_f) / p1;

            results[0].innerText = (target_f * 100).toFixed(2) + "%";
            results[1].innerText = Math.floor(N).toLocaleString();
            results[2].innerText = "$" + (Math.floor(N) * p1).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        inputs.forEach(id => el[id].addEventListener('input', calculate));
        calculate();
    </script>
</body>
</html>
